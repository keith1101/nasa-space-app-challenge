name: Deploy to Render

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Send Deploy Request to Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not set in GitHub repository secrets!"
            exit 1
          fi
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d: -f2)
          echo "Response body: $HTTP_BODY"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment successfully triggered."
          else
            echo "::error::Render returned failure status code $HTTP_STATUS"
            exit 1
          fi
