# ==============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# Project: NASA FIRMS Hotspot Harmonization Platform
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ============================================================================
  # Unified Fullstack Service (FastAPI + React Vite SPA)
  # - Multi-stage Docker build: compiles React frontend & installs Python stack
  # - Single domain: zero CORS issues, serves both /api/* and UI bundle
  # ============================================================================
  - type: web
    name: nasa-firms-platform
    runtime: docker
    plan: free # Change to starter/standard if dedicated RAM/CPU is desired
    region: singapore # Closest to Vietnam (or oregon, frankfurt)
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/data-status
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      # NASA FIRMS API Key for live satellite observations
      - key: FIRMS_MAP_KEY
        sync: false
      # Hybrid LLM Routing Engine: heuristic (default) | auto | edge | cloud
      - key: ROUTER_MODE
        value: heuristic
      # Gemini API configuration (optional)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # OpenAI API configuration (optional)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
