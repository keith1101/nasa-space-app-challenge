services:
  # ============================================================================
  # 1. Scientific Backend (FastAPI + AstroPy + SciPy)
  # ============================================================================
  - type: web
    name: spherex-astrometry-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
    healthCheckPath: /api/health

  # ============================================================================
  # 2. Minimalist Scientific Frontend (Vite + React 18 + Tailwind)
  # ============================================================================
  - type: web
    name: spherex-sky-viewer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback routing for React client-side navigation
      - type: rewrite
        source: /*
        destination: /index.html
