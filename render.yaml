services:
  - type: web
    name: nasa-firms-harmonization
    runtime: python
    region: singapore           # closest to Vietnam; change to: oregon, ohio, frankfurt, etc.
    plan: free                  # upgrade to starter ($7/mo) for always-on + more RAM

    # Render runs commands from the repo root.
    # rootDir is NOT set because render.yaml lives inside the sub-folder;
    # adjust if you place render.yaml at the top-level of the git repo.

    buildCommand: |
      # ── 1. Install Python dependencies ──────────────────────────
      pip install -r requirements.txt

      # ── 2. Install Node & build the React frontend ───────────────
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs
      cd frontend && npm ci && npm run build && cd ..

    startCommand: python3 -m backend.server

    envVars:
      # ── NASA FIRMS live data key (required for live mode) ────────
      # Get a free key → https://firms.modaps.eosdis.nasa.gov/api/area/
      - key: FIRMS_MAP_KEY
        sync: false              # set via Render dashboard (never commit secrets)

      # ── LLM routing (all optional) ───────────────────────────────
      - key: ROUTER_MODE
        value: heuristic         # safe default: zero-cost math engine
                                 # change to: auto | edge | cloud

      - key: OPENAI_API_KEY
        sync: false              # set in dashboard if using OpenAI

      - key: OPENAI_MODEL
        value: gpt-6luna

      - key: GEMINI_API_KEY
        sync: false              # set in dashboard if using Gemini

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ── Uvicorn / FastAPI tuning ──────────────────────────────────
      - key: PORT
        value: "8000"

      - key: PYTHONUNBUFFERED
        value: "1"
