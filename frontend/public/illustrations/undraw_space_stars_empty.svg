<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" role="img" aria-label="Deep space star field with observatory telescope awaiting astronomical data">
  <defs>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0050d8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#1b2b85" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c0f18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e7f434" stop-opacity="0"/>
      <stop offset="80%" stop-color="#e7f434" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e7f434" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2491ff"/>
      <stop offset="100%" stop-color="#0050d8"/>
    </linearGradient>
  </defs>

  <!-- Deep space background & nebula -->
  <rect width="500" height="350" rx="16" fill="#0c0f18"/>
  <circle cx="250" cy="160" r="140" fill="url(#nebulaGlow)"/>

  <!-- Celestial Coordinate Grid / RA-DEC lines -->
  <path d="M50 160 Q250 80 450 160" stroke="#1b2b85" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M50 220 Q250 140 450 220" stroke="#1b2b85" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <ellipse cx="250" cy="160" rx="180" ry="60" stroke="#1b2b85" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Background Stars -->
  <circle cx="90" cy="70" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="140" cy="120" r="1.5" fill="#e7f434" opacity="0.9"/>
  <circle cx="210" cy="60" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="340" cy="80" r="1.5" fill="#e7f434" opacity="0.9"/>
  <circle cx="410" cy="130" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="240" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="110" cy="260" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="290" cy="40" r="3" fill="#e7f434" opacity="0.85"/>

  <!-- Infrared Beam / Cone from Observatory -->
  <polygon points="250,220 200,90 300,90" fill="url(#beamGrad)"/>

  <!-- Central Target Reticle -->
  <circle cx="250" cy="90" r="28" stroke="#e7f434" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="250" cy="90" r="10" stroke="#00F0FF" stroke-width="2"/>
  <circle cx="250" cy="90" r="3" fill="#e7f434"/>
  <line x1="210" y1="90" x2="220" y2="90" stroke="#e7f434" stroke-width="2"/>
  <line x1="280" y1="90" x2="290" y2="90" stroke="#e7f434" stroke-width="2"/>
  <line x1="250" y1="50" x2="250" y2="60" stroke="#e7f434" stroke-width="2"/>
  <line x1="250" y1="120" x2="250" y2="130" stroke="#e7f434" stroke-width="2"/>

  <!-- Observatory Telescope Base & Optics -->
  <!-- Mount tripod -->
  <line x1="250" y1="260" x2="200" y2="310" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="260" x2="300" y2="310" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="260" x2="250" y2="315" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="250" cy="315" rx="70" ry="10" fill="#000000" opacity="0.4"/>

  <!-- Telescope Tube -->
  <g transform="rotate(-25 250 220)">
    <rect x="238" y="160" width="24" height="70" rx="6" fill="url(#bodyGrad)" stroke="#1b2b85" stroke-width="2"/>
    <ellipse cx="250" cy="160" rx="16" ry="8" fill="#e7f434"/>
    <rect x="244" y="225" width="12" height="15" rx="3" fill="#334155"/>
    <circle cx="250" cy="210" r="4" fill="#e7f434"/>
  </g>

  <!-- Telemetry Badge Text -->
  <rect x="155" y="295" width="190" height="26" rx="13" fill="#151622" stroke="#1b2b85" stroke-width="1.5"/>
  <text x="250" y="312" fill="#e7f434" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">
    SPHEREx OBSERVATORY IDLE
  </text>
</svg>
