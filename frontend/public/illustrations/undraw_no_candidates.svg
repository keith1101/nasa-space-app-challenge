<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none" role="img" aria-label="Astrometry radar scan showing zero detected candidates above noise threshold">
  <defs>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0050d8" stop-opacity="0.3"/>
      <stop offset="90%" stop-color="#1b2b85" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c0f18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="260" rx="12" fill="#0c0f18"/>
  <circle cx="200" cy="120" r="95" fill="url(#radarSweep)"/>

  <!-- Radar Range Rings -->
  <circle cx="200" cy="120" r="85" stroke="#1b2b85" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="200" cy="120" r="58" stroke="#1b2b85" stroke-width="1.2"/>
  <circle cx="200" cy="120" r="30" stroke="#1b2b85" stroke-width="1.2"/>
  <circle cx="200" cy="120" r="4" fill="#0050d8"/>

  <!-- Azimuth Crosshairs -->
  <line x1="95" y1="120" x2="305" y2="120" stroke="#1b2b85" stroke-width="1.2"/>
  <line x1="200" y1="20" x2="200" y2="220" stroke="#1b2b85" stroke-width="1.2"/>

  <!-- Scanning Sweep Beam -->
  <path d="M200 120 L275 60 A95 95 0 0 0 230 25 Z" fill="#e7f434" fill-opacity="0.18"/>
  <line x1="200" y1="120" x2="275" y2="60" stroke="#e7f434" stroke-width="2"/>

  <!-- Telemetry Badge -->
  <rect x="120" y="215" width="160" height="24" rx="12" fill="#151622" stroke="#1b2b85" stroke-width="1"/>
  <text x="200" y="231" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    S/N &gt; 5.0σ · 0 TARGETS
  </text>
</svg>
